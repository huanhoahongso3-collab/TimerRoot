name: Kernel port - derive conf

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "URL to boot.img"
        required: false
        default: ""
      vendor_boot_url:
        description: "URL to vendor_boot.img"
        required: false
        default: ""
      device_name:
        description: "Device name (e.g. OPPO Reno 16F)"
        required: false
        default: "Unknown Device"
      open_pr:
        description: "Open a pull request?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kernel-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive-conf:
    name: "Derive conf for ${{ inputs.device_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip llvm linux-tools-generic || true
          KERN=$(uname -r)
          sudo apt-get install -y --no-install-recommends "linux-tools-${KERN}" || true
          which bpftool || sudo apt-get install -y bpftool || true
          pip3 install -q vmlinux-to-elf
          sudo apt-get install -y --no-install-recommends mkbootimg || true
          which unpack_bootimg || pip3 install -q mkbootimg 2>/dev/null || true
          unpack_bootimg --version 2>/dev/null || true

      - name: Install payload-dumper-go
        run: |
          set -euo pipefail
          PDG_VER="2.1.0"
          curl -fsSL "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VER}/payload-dumper-go_${PDG_VER}_linux_amd64.tar.gz" | tar xz
          chmod +x payload-dumper-go
          ./payload-dumper-go --version || true

      - name: Download boot.img
        if: inputs.boot_url != ''
        run: |
          set -euo pipefail
          mkdir -p extracted
          curl -fL "${{ inputs.boot_url }}" -o extracted/boot.img
          ls -lh extracted/

      - name: Download vendor_boot.img
        if: inputs.vendor_boot_url != ''
        run: |
          set -euo pipefail
          mkdir -p extracted
          curl -fL "${{ inputs.vendor_boot_url }}" -o extracted/vendor_boot.img
          ls -lh extracted/vendor_boot.img

      - name: Verify boot.img
        run: |
          if [ ! -f extracted/boot.img ]; then
            echo "::error::No boot.img found."
            exit 1
          fi
          file extracted/boot.img

      - name: Unpack boot.img and get kernel release
        id: unpack
        run: |
          set -euo pipefail
          mkdir -p boot_out
          unpack_bootimg --boot_img extracted/boot.img --out boot_out
          KERNEL_IMAGE=""
          for f in boot_out/kernel boot_out/Image boot_out/zImage; do
            [ -f "$f" ] && KERNEL_IMAGE="$f" && break
          done
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel image found in boot_out/"
            ls -la boot_out/
            exit 1
          fi
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          # Try strings on raw image; if empty, vmlinux-to-elf will extract it later
          RELEASE=$(strings "$KERNEL_IMAGE" | grep -m1 'Linux version' | sed 's/Linux version \([^ ]*\).*/\1/' || true)
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "::notice::Kernel release (pre-decompress): $RELEASE"
          PAGE_SIZE=$(file "$KERNEL_IMAGE" | grep -oP '(?<=page size )\d+' || echo 4096)
          echo "PAGE_SIZE=$PAGE_SIZE" >> "$GITHUB_ENV"

      - name: vmlinux-to-elf
        run: |
          set -euo pipefail
          vmlinux-to-elf "$KERNEL_IMAGE" vmlinux.elf 2>&1 | tee /tmp/v2elf.log
          ls -lh vmlinux.elf
          # Extract release from vmlinux-to-elf output if strings didn't get it
          if [ -z "$RELEASE" ]; then
            RELEASE=$(grep -oP 'Linux version \K\S+' /tmp/v2elf.log | head -1 || true)
            if [ -n "$RELEASE" ]; then
              echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
              echo "::notice::Kernel release (from vmlinux-to-elf): $RELEASE"
            fi
          fi

      - name: Derive conf
        id: derive
        run: |
          set -euo pipefail
          CONF_NAME=$(echo "$RELEASE" | tr '/' '-' | tr ' ' '-')
          if [ "$PAGE_SIZE" = "4096" ]; then
            CONF_FILE="conf/${CONF_NAME}-4k.conf"
          else
            KP=$((PAGE_SIZE / 1024))
            CONF_FILE="conf/${CONF_NAME}-${KP}k.conf"
          fi
          echo "CONF_FILE=$CONF_FILE" >> "$GITHUB_ENV"
          echo "conf_file=$CONF_FILE" >> "$GITHUB_OUTPUT"
          VBOOT=""
          [ -f "extracted/vendor_boot.img" ] && VBOOT="--vendor-boot extracted/vendor_boot.img"
          python3 scripts/derive_conf.py \
            --vmlinux vmlinux.elf \
            $VBOOT \
            --release "$RELEASE" \
            --page-size "$PAGE_SIZE" \
            --device "${{ inputs.device_name }}" \
            --output "$CONF_FILE"
          cat "$CONF_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build timer binary (for selfcheck)
        env:
          NDK_VERSION: "29.0.14206865"
          TARGET: "aarch64-linux-android21"
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM=""
          for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && SM="$c" && break
          done
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ] || "$SM" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"
          fi
          CC=$(find "$SDK_ROOT/ndk" -path "*/bin/${TARGET}-clang" 2>/dev/null | head -1)
          if [ -z "$CC" ]; then
            echo "::warning::NDK clang not found; skipping selfcheck"
            echo "TIMER_BUILT=false" >> "$GITHUB_ENV"
          else
            "$CC" -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -g -static -pthread -o timer_bin p7a/timer_p7a.c
            echo "TIMER_BUILT=true" >> "$GITHUB_ENV"
            echo "TIMER_PATH=timer_bin" >> "$GITHUB_ENV"
          fi

      - name: Selfcheck
        if: env.TIMER_BUILT == 'true'
        run: |
          chmod +x "$TIMER_PATH"
          "$TIMER_PATH" --conf "$CONF_FILE" selfcheck && echo "selfcheck passed" || echo "::warning::selfcheck failed"
          "$TIMER_PATH" --conf "$CONF_FILE" target && echo "target passed" || true

      - name: Upload conf artifact
        uses: actions/upload-artifact@v4
        with:
          name: "derived-conf"
          path: ${{ env.CONF_FILE }}
          retention-days: 30

      - name: Commit conf and open PR
        if: inputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DNAME="${{ inputs.device_name }}"
          DNAME="${DNAME:-unknown}"
          BRANCH="port/${DNAME}-$(date +%Y%m%d)"
          BRANCH=$(echo "$BRANCH" | tr ' /' '-' | tr -dc '[:alnum:]-_')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CONF_FILE" scripts/derive_conf.py
          git commit -m "port: add ${{ inputs.device_name }} conf (auto-derived)"
          git push origin "$BRANCH"
          gh pr create \
            --title "port: ${{ inputs.device_name }} ($RELEASE)" \
            --body "Auto-derived conf for ${{ inputs.device_name }} kernel $RELEASE" \
            --base main \
            --head "$BRANCH"
