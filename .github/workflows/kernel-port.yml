name: Kernel port - derive conf

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "URL to boot.img"
        required: false
        default: ""
      vendor_boot_url:
        description: "URL to vendor_boot.img"
        required: false
        default: ""
      device_name:
        description: "Device name (e.g. OPPO Reno 16F)"
        required: false
        default: "Unknown Device"
      open_pr:
        description: "Open a pull request?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kernel-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive-conf:
    name: "Derive conf for ${{ inputs.device_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - run: echo "device=${{ inputs.device_name }}"
